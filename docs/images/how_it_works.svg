<text x="649" y="38" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a7f37" text-anchor="start" xml:space="preserve">You get</text>
<text x="649" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">a run folder</text>
