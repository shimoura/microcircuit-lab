<text x="84" y="164" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" xml:space="preserve">writes configs/network/&lt;name&gt;/</text>
