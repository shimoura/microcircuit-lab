[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "microcircuit_lab"
version = "0.1.0"
description = "A flexible framework for building, simulating, and analyzing biologically inspired neural microcircuit models."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Renan O. Shimoura" }
]

dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "mne",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["microcircuit_lab*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
nest = [
    "nest-simulator>=3.0",
]
nestml = [
    "nestml",
]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently pull in a new default
# rule category (isort, pyupgrade, pylint-style, ...) and break CI without
# a deliberate decision to adopt it. This is pyflakes (F) plus the
# pycodestyle error subset (E4/E7/E9) -- ruff's own long-standing default
# selection before ruff 0.16 broadened what an unconfigured `ruff check`
# enables by default.
select = ["E4", "E7", "E9", "F"]