[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "microcircuit_lab"
version = "0.1.0"
description = "A flexible framework for building, simulating, and analyzing biologically inspired neural microcircuit models."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Renan O. Shimoura" }
]

dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "nest-simulator>=3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["microcircuit_lab*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]