[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microcircuit_lab"
version = "0.1.0"
description = "A flexible framework for building, simulating, and analyzing biologically inspired neural microcircuit models."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"

authors = [
    { name = "Renan Oliveira Shimoura" }
]
keywords = [
    "computational neuroscience",
    "spiking neural networks",
    "cortical microcircuit",
    "multi-area model",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "mne",
]

[project.urls]
Repository = "https://github.com/shimoura/microcircuit-lab"
Issues = "https://github.com/shimoura/microcircuit-lab/issues"

[project.scripts]
microcircuit-lab = "microcircuit_lab.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["microcircuit_lab*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
nest = [
    "nest-simulator>=3.0",
]
nestml = [
    "nestml",
]

[tool.pytest.ini_options]
# builders/ sits next to microcircuit_lab/, outside the installed package, and
# pytest does not put the repository root on the import path by itself. Without
# this, tests that import builders.* fail with ModuleNotFoundError.
pythonpath = ["."]

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently pull in a new default
# rule category (isort, pyupgrade, pylint-style, ...) and break CI without
# a deliberate decision to adopt it. This is pyflakes (F) plus the
# pycodestyle error subset (E4/E7/E9) -- ruff's own long-standing default
# selection before ruff 0.16 broadened what an unconfigured `ruff check`
# enables by default.
select = ["E4", "E7", "E9", "F"]