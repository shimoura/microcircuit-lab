[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "microcircuit_lab"
# The version comes from the git tag (v0.1.0 -> 0.1.0; see [tool.setuptools_scm]).
dynamic = ["version"]
description = "Build, simulate and analyse spiking neural network models, from a single microcircuit to multi-area models."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"

authors = [
    { name = "Renan Oliveira Shimoura" }
]
keywords = [
    "computational neuroscience",
    "spiking neural networks",
    "cortical microcircuit",
    "multi-area model",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.10",
]

[project.urls]
Repository = "https://github.com/shimoura/microcircuit-lab"
Issues = "https://github.com/shimoura/microcircuit-lab/issues"

[project.scripts]
microcircuit-lab = "microcircuit_lab.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
# The version is the latest tag (v0.1.0 -> 0.1.0). Between releases it also names
# the commit (0.1.1.dev3+g505c8ed), which each run records in metadata.json.
# A release is: tag, push the tag, publish the release on GitHub.

[tool.setuptools.packages.find]
include = ["microcircuit_lab*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mne",
]
multitaper = [
    "mne",
]
nest = [
    "nest-simulator>=3.0",
]
nestml = [
    "nestml",
]
brian2 = [
    "brian2>=2.5",
]

[tool.pytest.ini_options]
# builders/ sits next to microcircuit_lab/, outside the installed package, and
# pytest does not put the repository root on the import path by itself. Without
# this, tests that import builders.* fail with ModuleNotFoundError.
pythonpath = ["."]

[tool.ruff.lint]
# The rule list is pinned so a ruff upgrade cannot add new rules by itself.
# E4/E7/E9 and F are the pyflakes and pycodestyle error rules; I sorts imports and UP updates old syntax.
select = ["E4", "E7", "E9", "F", "I", "UP"]