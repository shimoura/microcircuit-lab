# toy_stimulated has two independent E/I circuits (iaf_psc_exp and
# aeif_cond_exp); color_mode: custom is used instead of cell_type because
# cell_type would give E/E_adex (both cell type "E") and I/I_adex (both
# "I") the same color.
style:
  color_mode: custom
  custom_colors:
    E: "#595289"
    I: "#af143c"
    E_adex: "#2a9d8f"
    I_adex: "#e76f51"
  tick_label_size: 5.0
  axis_label_size: 8.0
  legend_size: 6.0
  dpi: 300

raster:
  marker_size: 1.0
  alpha: 1.0
  figsize: [4, 3]
  separator_lines: true
  show_legend: false
  neuron_fraction: 0.5

firing_rates:
  figsize: [5, 3.5]
  show_points: false
  show_mean: true
  show_legend: true

power_spectrum:
  width_per_column: 3.0
  height_per_row: 1.6

isi_cv:
  figsize: [5, 3.5]
  show_points: false
  show_mean: true
  show_legend: true
