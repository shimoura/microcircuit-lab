area: all
style:
  color_mode: cell_type
  cell_type_colors:
    E: "#595289"
    PV: "#af143c"
    SOM: "#e08a1e"
    VIP: "#2e8b57"
  tick_label_size: 5.0
  axis_label_size: 8.0
  legend_size: 6.0
  dpi: 300

raster:
  marker_size: 1.0
  alpha: 1.0
  figsize: [5, 8]   # each cluster on its own row: three times as many as toy_two_areas
  separator_lines: true
  show_legend: false

firing_rates:
  figsize: [5, 8]
  show_points: false
  show_mean: true
  show_legend: true

power_spectrum:
  width_per_column: 3.0
  height_per_row: 1.6

isi_cv:
  figsize: [5, 8]
  show_mean: true
