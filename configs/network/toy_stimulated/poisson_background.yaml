# Background: each neuron of a population gets `indegree` independent Poisson
# synapses, each firing at `rate` (spikes/s). Other always-on inputs (a constant
# current, a Poisson train, an inhomogeneous Poisson input) are stimuli.yaml
# entries without start/stop.
poisson_background:

  E:
    rate: 8.0
    indegree: 1000
    weight:
      value: 87.80849352920843  # a 0.15 mV PSP
      unit: pA
    delay:
      value: 1.5

  I:
    rate: 8.0
    indegree: 1000
    weight:
      value: 87.80849352920843  # a 0.15 mV PSP
      unit: pA
    delay:
      value: 1.5

  # Unlike E/I above, this weight is a synaptic conductance (unit: nS),
  # since aeif_cond_exp is conductance-based. 0.6 nS is sized so background alone (at
  # this rate * indegree) brings the mean membrane potential
  # to within a few mV of V_th, the same "near-threshold, fluctuation
  # driven" regime E/I sits in; see connectivity.yaml for how that value
  # was derived.
  E_adex:
    rate: 8.0
    indegree: 1000
    weight:
      value: 1.2
      unit: nS
    delay:
      value: 1.5

  I_adex:
    rate: 8.0
    indegree: 1000
    weight:
      value: 1.2
      unit: nS
    delay:
      value: 1.5
