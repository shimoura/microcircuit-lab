# Each weight.mean is what the simulator gets, in weight.unit: pA (a
# current, as iaf_psc_exp takes), nS (a conductance) or mV. Nothing is
# converted. The weights here were chosen as PSP amplitudes (the comment
# after each value) and converted to pA once, with
# builder_tools.psp_to_psc_iaf_psc_exp and the target's C_m, tau_m and
# tau_syn. A distribution is optional (default: normal).
#
# All fields: the core's docs/config_files.md.
connections:

  - source: E
    target: E
    n_synapses: 64000
    weight:
      mean: 87.80849352920843  # a 0.15 mV PSP
      rel_std: 0.1
      distribution: normal
      unit: pA
    delay:
      mean: 1.5
      rel_std: 0.5
      distribution: normal

  - source: I
    target: E
    n_synapses: 16000
    weight:
      mean: -351.23397411683374  # a -0.6 mV PSP
      rel_std: 0.1
      distribution: normal
      unit: pA
    delay:
      mean: 0.75
      rel_std: 0.5
      distribution: normal

  - source: E
    target: I
    n_synapses: 16000
    weight:
      mean: 87.80849352920843  # a 0.15 mV PSP
      rel_std: 0.1
      distribution: normal
      unit: pA
    delay:
      mean: 1.5
      rel_std: 0.5
      distribution: normal

  - source: I
    target: I
    n_synapses: 4000
    weight:
      mean: -351.23397411683374  # a -0.6 mV PSP
      rel_std: 0.1
      distribution: normal
      unit: pA
    delay:
      mean: 0.75
      rel_std: 0.5
      distribution: normal
