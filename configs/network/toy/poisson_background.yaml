# Background Poisson input, one entry per population (keyed by the name
# from populations.yaml): each neuron gets `indegree` independent Poisson
# synapses, each firing at `rate` (spikes/s). `weight.unit` works exactly as in
# connectivity.yaml. Other always-on inputs (a constant current, a Poisson
# train, an inhomogeneous Poisson input) are stimuli.yaml entries without
# start/stop. To replace the Poisson drive by a constant current of the same
# mean, write the network with `replace_background_by_mean_current` (builder_tools).
poisson_background:

  E:
    rate: 8.0
    indegree: 1000
    weight:
      mean: 87.80849352920843  # a 0.15 mV PSP
      rel_std: 0.0
      distribution: fixed
      unit: pA
    delay:
      mean: 1.5
      rel_std: 0.0
      distribution: fixed

  I:
    rate: 8.0
    indegree: 1000
    weight:
      mean: 87.80849352920843  # a 0.15 mV PSP
      rel_std: 0.0
      distribution: fixed
      unit: pA
    delay:
      mean: 1.5
      rel_std: 0.0
      distribution: fixed
