# Named neuron definitions; populations.yaml refers to one of these by key.
# `model` is the simulator's neuron model name. `parameters` is passed to
# that model as-is -- the keys here are iaf_psc_exp's; a different model
# takes different ones, and the backend (not this framework) is what
# rejects an unknown parameter name. `I_e` (constant bias current, pA) is
# the one parameter the framework reads back, since network scaling adds
# DC compensation to it; if omitted, it is not passed to the model.
#
# All fields: the core's docs/config_files.md.
neurons:
  excitatory:
    model: iaf_psc_exp

    parameters:
      C_m: 250.0
      tau_m: 10.0

      tau_syn_ex: 0.5
      tau_syn_in: 0.5

      E_L: -65.0
      V_reset: -65.0
      V_th: -50.0

      t_ref: 2.0

      I_e: 0.0

  inhibitory:
    model: iaf_psc_exp

    parameters:
      C_m: 250.0
      tau_m: 10.0

      tau_syn_ex: 0.5
      tau_syn_in: 0.5

      E_L: -65.0
      V_reset: -65.0
      V_th: -50.0

      t_ref: 2.0

      I_e: 0.0
