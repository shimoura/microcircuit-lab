# Always-on background drive, one entry per population (keyed by the name
# from populations.yaml). Each population's total background rate is this
# `rate` times its `background_indegree`. `weight.unit` works exactly as in
# connectivity.yaml. Add `background_mode: mean_current` at the top level to replace
# the Poisson drive network-wide with a constant current of the same mean.
background_inputs:

  E:
    rate: 8.0
    weight:
      mean: 87.80849352920843  # a 0.15 mV PSP
      rel_std: 0.0
      distribution: fixed
      unit: pA
    delay:
      mean: 1.5
      rel_std: 0.0
      distribution: fixed

  I:
    rate: 8.0
    weight:
      mean: 87.80849352920843  # a 0.15 mV PSP
      rel_std: 0.0
      distribution: fixed
      unit: pA
    delay:
      mean: 1.5
      rel_std: 0.0
      distribution: fixed
