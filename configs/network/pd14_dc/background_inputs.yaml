# Same background drive as configs/network/pd14, but delivered as a
# constant current (I_e) of equal mean instead of a Poisson process --
# reproducing the Poisson-vs-DC background comparison from Potjans &
# Diesmann (2014), Fig. 5. rate/weight/delay below still define that
# mean (see NetworkPreprocessor._apply_background_dc_current); no
# Poisson generator is created.
background_mode: dc

background_inputs:

  L23_E:
    rate: 8.0
    weight:
      mean: 0.15
      rel_std: 0.0
      distribution: fixed
      unit: PSP
    delay:
      mean: 1.5
      rel_std: 0.5
      distribution: fixed

  L23_I:
    rate: 8.0
    weight:
      mean: 0.15
      rel_std: 0.0
      distribution: fixed
      unit: PSP
    delay:
      mean: 1.5
      rel_std: 0.5
      distribution: fixed

