name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Brian2 2.10 needs Python 3.12, so on 3.11 the Brian2 tests are skipped.
      - name: Install package (with dev, nest and, from Python 3.12, brian2 extras)
        run: pip install -e ".[dev,nest${{ matrix.python-version != '3.11' && ',brian2' || '' }}]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest
