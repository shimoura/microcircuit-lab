t_sim: 1000.0
resolution: 0.1
rng_seed: 42
local_num_threads: 4
# Off: in a notebook, NEST's progress line hangs runs with many short steps (docs/nest.md)
print_time: false

recording:
  spike_recording: true
  # variables: {V_m: {interval: 1.0, sample_size: 5}}

output:
  # No output_dir: each network's runs go to output/<network name>.
  overwrite: false
  save_metadata: true
  save_config: true
